# WebXR teleoperation on MuJoCo, with no real OpenArm: the webxr node talks
# to the VR headset's browser over WebRTC, receiving the controller poses and
# buttons over a data channel and streaming MuJoCo's stereo head camera back
# as video. controller poses -> end-effector pose targets -> IK -> joint
# angles -> MuJoCo, and MuJoCo's head camera back to the headset.

nodes:
  - id: webxr # browser keys → EE pose targets, camera → browser
    build: pip install dora-openarm-webxr
    path: dora-openarm-webxr
    args: "--quit-button b"
    inputs:
      # Keeps the view on the newest frame. Without it, frames the VR
      # device cannot keep up with queue and latency grows.
      camera_head_right:
        source: mujoco/camera_head_right
        queue_size: 1
      # Only used by the stereo view. Swap the two sources if your
      # openarm_mujoco build still has the head cameras flipped.
      camera_head_left:
        source: mujoco/camera_head_left
        queue_size: 1
    outputs:
      - pose_right
      - trigger_right
      - pose_left
      - trigger_left
      - grip_right
      - grip_left
      - joystick_x_right
      - joystick_y_right
      - joystick_x_left
      - joystick_y_left
      - button_a
      - button_b
      - button_x
      - button_y
      - status
      - vr_receive_times
      - pose_reference

  - id: ik # differential IK: EE poses → joint angles
    build: pip install dora-openarm-kinematics
    path: dora-openarm-ik
    inputs:
      # The solver runs on each target, not on the tick.
      target_right: webxr/pose_right
      target_left: webxr/pose_left
    outputs:
      - position_right
      - position_left
      - status

  - id: mujoco # MuJoCo scene, rendered offscreen for the browser
    build: pip install dora-openarm-mujoco
    path: dora-openarm-mujoco
    args: "--enable-collision --ctrl --render"
    inputs:
      position_right: ik/position_right
      position_left: ik/position_left
      pose_right: webxr/pose_right
      pose_left: webxr/pose_left
      joystick_y: webxr/joystick_y_left
      button_x: webxr/button_x
    outputs:
      - status
      - camera_head_right
      - camera_head_left

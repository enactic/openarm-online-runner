# Keyboard teleoperation of a real dual-arm OpenArm cell from a web browser,
# with no VR headset: the keyboard node serves a page (http://127.0.0.1:8080/
# by default) that captures keys over a WebRTC data channel and shows the
# ceiling camera as WebRTC video. keyboard -> end-effector pose targets ->
# IK -> joint angles -> the follower arms, and the ceiling camera back to the
# browser. The arms move only while a motion key is held and the page has
# focus.

nodes:
  - id: quittable-tick-camera
    build: pip install dora-openarm-quitter
    path: dora-openarm-quitter
    inputs:
      command: keyboard/command
      tick: dora/timer/millis/33  # ~30 fps
    outputs:
      - tick

  - id: keyboard # browser keys → EE pose targets, camera → browser
    build: pip install -e ..
    path: dora-openarm-keyboard
    inputs:
      # Any camera_* output of the viewer works here; ceiling gives the best
      # overview of both arms.
      image: camera-ceiling/image
    outputs:
      - pose_right
      - pose_left
      # Drives the quittable tick nodes' shutdown (quit) and, when a physical
      # lifter is part of the dataflow, dora-openarm-lifter (lifter-stop on
      # exit so the lifter never keeps moving).
      - command
      - status

  - id: ik # differential IK: EE poses → joint angles
    build: pip install dora-openarm-kinematics
    path: dora-openarm-ik
    inputs:
      # The solver runs on each target, not on the tick.
      target_right: keyboard/pose_right
      target_left: keyboard/pose_left
    outputs:
      - position_left
      - position_right
      - status

  - id: follower-right
    build: pip install dora-openarm
    path: dora-openarm
    args: "--side right --start-on-startup"
    inputs:
      move_position: ik/position_right
    outputs:
      - status

  - id: follower-left
    build: pip install dora-openarm
    path: dora-openarm
    args: "--side left --start-on-startup"
    inputs:
      move_position: ik/position_left
    outputs:
      - status

  - id: camera-ceiling
    build: pip install opencv-video-capture
    path: opencv-video-capture
    env:
      # Please configure!
      CAPTURE_PATH: "/dev/camera_ceiling"
      ENCODING: "jpeg"
      IMAGE_HEIGHT: 600
      IMAGE_WIDTH: 960
      JPEG_QUALITY: 90
    inputs:
      tick: quittable-tick-camera/tick
    outputs:
      - image
